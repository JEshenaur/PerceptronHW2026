<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perceptron L vs T</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 50px);
      gap: 8px;
      justify-content: center;
      margin: 20px 0;
    }

    .cell {
      width: 50px;
      height: 50px;
      border: 1px solid black;
      background: white;
      cursor: pointer;
    }

    .cell.active {
      background: black;
    }

    button {
      margin: 5px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    #output {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>L vs T Perceptron</h1>
  <p>Click squares to make an L or T, then press Predict.</p>

  <div class="grid" id="grid"></div>

  <button onclick="predictLetter()">Predict</button>
  <button onclick="clearGrid()">Clear</button>

  <p id="output">Prediction:</p>

  <script>
    const grid = document.getElementById("grid");
    const output = document.getElementById("output");

    const weights = [
      -0.2, 0.2, 0.4, 0.4,
      -0.2, 0.2, 0.4, 0.2,
      -0.4, 0.0, 0.0, -0.2,
      -0.2, 0.0, -0.2, -0.4
    ];

    const bias = 0.0;

    for (let i = 0; i < 16; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.value = "0";

      cell.addEventListener("click", function () {
        if (cell.dataset.value === "0") {
          cell.dataset.value = "1";
          cell.classList.add("active");
        } else {
          cell.dataset.value = "0";
          cell.classList.remove("active");
        }
      });

      grid.appendChild(cell);
    }

    function getInputs() {
      const cells = document.querySelectorAll(".cell");
      let inputs = [];
      cells.forEach(cell => {
        inputs.push(Number(cell.dataset.value));
      });
      return inputs;
    }

    function activationFunction(z) {
      return z >= 0 ? 1 : -1;
    }

    function dotProduct(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i++) {
        sum += a[i] * b[i];
      }
      return sum;
    }

    function predictLetter() {
      const inputs = getInputs();
      const linearOutput = dotProduct(inputs, weights) + bias;
      const yPred = activationFunction(linearOutput);

      // In your Python code: T = 1, L = -1
      const label = yPred === 1 ? "T" : "L";

      output.textContent = "Prediction: " + label;
    }

    function clearGrid() {
      const cells = document.querySelectorAll(".cell");
      cells.forEach(cell => {
        cell.dataset.value = "0";
        cell.classList.remove("active");
      });
      output.textContent = "Prediction:";
    }
  </script>

</body>
</html>
